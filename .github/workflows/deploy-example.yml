name: Deploy or Test with Private Image

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CRITICAL: Login untuk akses private image
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: irfan33
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Sekarang bisa pull private image
      - name: Pull private image
        run: |
          docker pull irfan33/koperasi-webshop:latest
          docker images

      # Use image untuk testing atau deployment
      - name: Run tests
        run: |
          docker run --rm irfan33/koperasi-webshop:latest bench --version

      # Or deploy via docker-compose
      - name: Deploy with docker-compose
        run: |
          cd docker/
          docker-compose pull
          docker-compose up -d
